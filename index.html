<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ECHO COSMOS — Shattered Cosmos Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1216; --panel:#161a20; --panel2:#1c2129; --border:#2a3038;
    --text:#e8ebef; --text-dim:#9aa4b2; --accent:#5b9dff; --accent-dim:#2e4a72;
    --row-alt:#141820; --row-hover:#1f2530; --sidebar-w:190px;
    font-size:15px;
  }
  *{box-sizing:border-box}
  html, body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .page{display:flex; align-items:flex-start}
  .sidebar{
    width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
    position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--border);
    padding:14px 12px; display:flex; flex-direction:column; gap:10px;
  }
  .content{flex:1; min-width:0; padding:14px 20px}
  h1{font-size:14px; margin:0 0 1px; font-weight:600; letter-spacing:.02em}
  .subtitle{color:var(--text-dim); font-size:10px; margin:0 0 8px; line-height:1.3}
  .field{display:flex; flex-direction:column; gap:3px}
  .field.hidden{display:none}
  .field label{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-dim)}
  select, input[type=text]{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 8px; font-size:13px; width:100%;
  }
  select:focus, input:focus{outline:none; border-color:var(--accent)}
  .meta{color:var(--text-dim); font-size:12px; margin:0 2px 10px}
  .meta strong{color:var(--text)}
  table{width:100%; border-collapse:collapse; font-size:14px; border-radius:10px; overflow:hidden}
  thead th{
    position:sticky; top:0; background:var(--panel2); text-align:left;
    padding:9px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-dim); border-bottom:1px solid var(--border); cursor:pointer;
    user-select:none; white-space:nowrap; z-index:5;
  }
  thead th:hover{color:var(--text)}
  thead th.sorted{color:var(--accent)}
  thead th .arrow{font-size:10px; margin-left:3px; opacity:.7}
  tbody td{padding:8px 12px; border-bottom:1px solid var(--border)}
  tbody tr:nth-child(even){background:var(--row-alt)}
  tbody tr:hover{background:var(--row-hover)}
  td.rank{color:var(--text-dim); font-variant-numeric:tabular-nums; width:1%}
  td.dmg, td.pct{font-variant-numeric:tabular-nums; text-align:right}
  td.rank, td.dmg, td.pct{white-space:nowrap}
  th.dmg, th.pct, td.dmg, td.pct{width:1%}
  th.dmg, th.pct{text-align:right}
  .th-i{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; margin-left:5px;
    border-radius:50%; border:1px solid currentColor; font:italic 600 9px Georgia,serif; text-transform:none;
    vertical-align:1px; cursor:help; opacity:.75}
  .th-i:hover{opacity:1; color:var(--accent)}
  td.pct{color:var(--text-dim); width:1%}
  .rank-1{color:#ffd54a}
  .rank-2{color:#c9d3e0}
  .rank-3{color:#d99a5e}
  .empty{padding:40px; text-align:center; color:var(--text-dim)}
  .top1{color:var(--text-dim); font-size:12px; margin-left:6px}
  .field.check{flex-direction:row; align-items:center; gap:6px}
  .field.check label{text-transform:none; letter-spacing:0; font-size:12px; color:var(--text)}
  .good{color:#6fd08c} .bad{color:#ff8a7a}
  .dim{color:var(--text-dim); font-size:12px}
  .mini-bar{display:inline-block; height:6px; border-radius:3px; margin:0 8px 0 0; vertical-align:middle; opacity:.8}
  .mini-bar.g{background:#6fd08c} .mini-bar.b{background:#ff8a7a}
  .tips{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin:0 0 14px; font-size:13.5px; line-height:1.55}
  .tips p{margin:4px 0}
  .tips ol{margin:4px 0 2px; padding-left:20px}
  .tips li{margin:3px 0}
  .tips h2{margin-top:2px}
  .acc-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 10px}
  .acc-name{font-size:24px; font-weight:700; letter-spacing:.01em}
  .acc-sub{color:var(--text-dim); font-size:13px}
  .tier{display:flex; flex-direction:column; align-items:flex-end; padding:8px 16px; border-radius:10px;
    border:1px solid #0ea5c6; box-shadow:0 0 14px rgba(14,165,198,.45), inset 0 0 10px rgba(14,165,198,.15)}
  .tier span{font-size:20px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#e8fbff;
    text-shadow:0 0 8px #0ea5c6, 0 0 18px #0ea5c6}
  .tier small{color:var(--text-dim); font-size:11px}
  .tier-carry{border-color:#cf7426; box-shadow:0 0 16px rgba(207,116,38,.55), inset 0 0 10px rgba(207,116,38,.18)}
  .tier-carry span{text-shadow:0 0 8px #cf7426, 0 0 20px #cf7426; color:#fff3e6}
  .tier-rookie, .tier-solid{box-shadow:none}
  .tier-rookie span, .tier-solid span{text-shadow:none}
  .traits{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px}
  .traits .tag{font-size:12px; padding:2px 9px; color:var(--text-dim)}
  .traits .tag.good{color:#6fd08c} .traits .tag.bad{color:#ff8a7a}
  .chart-box{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px}
  .chart-box h2{margin:0 0 4px}
  .chart-box .dim{margin:0 0 4px}
  .chart{width:100%; height:auto; display:block}
  .chart .grid{stroke:#232a33; stroke-width:1}
  .chart .xhair{stroke:#4a5463; stroke-width:1; stroke-dasharray:3 3; opacity:0; pointer-events:none}
  .chart .hit:hover + .xhair{opacity:1}
  .chart .axis{fill:var(--text-dim); font-size:11px}
  .chart .lbl{fill:var(--text); font-size:12px}
  .chart .val{fill:var(--text); font-size:12px; font-variant-numeric:tabular-nums}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-dim); margin:0 0 4px}
  .legend i{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px}
  .legend i.dash{height:0; border-top:2px dashed; background:none}
  details.fold{margin:0 0 12px}
  details.fold > summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px}
  details.fold > summary::-webkit-details-marker{display:none}
  details.fold > summary::before{content:"▸"; color:var(--text-dim); font-size:12px; transition:transform .15s}
  details.fold[open] > summary::before{transform:rotate(90deg)}
  details.fold > summary h2{margin:0}
  details.fold > summary::after{content:"show"; margin-left:auto; font-size:11px; color:var(--accent)}
  details.fold[open] > summary::after{content:"hide"}
  details.fold[open] > summary{margin-bottom:6px}
  .tip{position:fixed; z-index:50; pointer-events:none; background:#1c2129; border:1px solid var(--border);
    color:var(--text); font-size:12px; padding:6px 9px; border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,.4); max-width:320px}
  .tip[hidden]{display:none}
  .tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid currentColor; white-space:nowrap}
  .info-btn{display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px;
    margin-left:6px; border-radius:50%; border:1px solid var(--text-dim); background:none; color:var(--text-dim);
    font:italic 600 11px Georgia,serif; cursor:pointer; vertical-align:1px; padding:0}
  .info-btn:hover, .info-btn.open{color:var(--accent); border-color:var(--accent)}
  .info{background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:8px; padding:10px 14px; margin:0 0 12px; font-size:12.5px; line-height:1.5; color:var(--text-dim)}
  .info[hidden]{display:none}
  .info b{color:var(--text); font-weight:600}
  .info ul{margin:4px 0 0; padding-left:18px}
  .info p{margin:0 0 4px}
  .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin:0 0 14px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 12px}
  .card-l{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em}
  .card-v{font-size:20px; font-weight:600; margin:2px 0; font-variant-numeric:tabular-nums}
  .card-v small{font-size:12px; color:#6fd08c; font-weight:500}
  .card-s{font-size:12px; color:var(--text-dim)}
  .planner-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(330px, 1fr)); gap:14px; margin:0 0 14px}
  .planner-grid p{color:var(--text-dim); font-size:12px}
  .extra h2 .link-btn{margin-left:8px}
  .link-btn{background:none; border:none; color:var(--accent); font-size:11px; cursor:pointer; padding:0;
    text-transform:none; letter-spacing:0; text-decoration:underline}
  input[type=number]{background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 8px; font-size:13px; width:100%}
  input.wi{cursor:pointer; width:15px; height:15px}
  .extra:empty{display:none}
  .extra{margin:0 0 14px}
  .extra h2{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); margin:0 0 6px; font-weight:600}
  .extra p{color:var(--text-dim); font-size:12px; margin:6px 2px 0; line-height:1.4}
  .extra table{font-size:13px}
  .extra tbody td{padding:6px 12px}
  .table-wrap{border:1px solid var(--border); border-radius:10px; overflow-x:auto; max-width:100%}
  body.locked .page{display:none}
  .lock{position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px}
  body.locked .lock{display:flex}
  .lock form{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:22px;
    width:100%; max-width:480px; display:flex; flex-direction:column; gap:10px}
  .lock input{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px;
    padding:8px 10px; font-size:14px}
  .pw-label{display:flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase;
    letter-spacing:.03em; color:var(--text-dim)}
  .lock .pw-eye{background:none; border:none; padding:2px; color:var(--text-dim); display:flex; cursor:pointer}
  .lock .pw-eye:hover, .lock .pw-eye:focus-visible{color:var(--text)}
  .pw-eye svg{width:16px; height:16px}
  .pw-eye .eye-off{display:none}
  .pw-eye.shown .eye-on{display:none}
  .pw-eye.shown .eye-off{display:block}
  .lock button{background:var(--accent-dim); color:var(--text); border:1px solid var(--accent); border-radius:6px;
    padding:8px; font-size:14px; cursor:pointer}
  .lock button:disabled{opacity:.6; cursor:wait}
  .lock .msg{color:#ff8a7a; font-size:12px; min-height:1em; margin:0}
  @media (max-width: 640px){
    .page{flex-direction:column; align-items:stretch}
    .sidebar{width:100%; flex:0 0 auto; position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); flex-direction:row; flex-wrap:wrap}
    .sidebar .field{flex:1 1 130px}
    .content{padding:12px}
    tbody td:not(.rank):not(.dmg):not(.pct){white-space:normal; word-break:break-word}
    .top1{display:block; margin-left:0}
  }
</style>
</head>
<body class="locked">

<div class="lock">
  <form id="lock-form" autocomplete="on">
    <h1>Cosmos Damage</h1>
    <div class="pw-label">
      <label for="lock-pw">Password</label>
      <button type="button" class="pw-eye" id="lock-eye" aria-label="Show password" title="Show password">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <input type="password" id="lock-pw" autocomplete="current-password" spellcheck="false" required>
    <button type="submit" id="lock-btn">Unlock</button>
    <p class="msg" id="lock-msg"></p>
  </form>
</div>

<div class="page">
  <aside class="sidebar">
    <div>
      <h1>Cosmos Damage</h1>
      <p class="subtitle">ASIA - by @vueltra</p>
    </div>
    <div class="field">
      <label for="f-season">Season</label>
      <select id="f-season"></select>
    </div>
    <div class="field">
      <label for="f-view">View</label>
      <select id="f-view">
        <optgroup label="Simple">
          <option value="damage">Total damage</option>
          <option value="single">Single DMG</option>
          <option value="planner">Planner</option>
          <option value="bases">Bases (astral)</option>
          <option value="account">Account checker</option>
        </optgroup>
        <optgroup label="Advanced">
          <option value="plannerAdv">Planner – details &amp; what-if</option>
          <option value="astral">Astral – rank details</option>
        </optgroup>
      </select>
    </div>
    <div class="field" id="field-ranktype">
      <label for="f-ranktype">Rank type</label>
      <select id="f-ranktype">
        <option value="player">Player</option>
        <option value="alliance">Alliance</option>
        <option value="server">Server</option>
      </select>
    </div>
    <div class="field" id="field-alliance">
      <label for="f-alliance" id="label-alliance">Alliance</label>
      <select id="f-alliance"></select>
    </div>
    <div class="field" id="field-server">
      <label for="f-server">Server</label>
      <select id="f-server"></select>
    </div>
    <div class="field" id="field-singlemode">
      <label for="f-singlemode">Compare</label>
      <select id="f-singlemode">
        <option value="player">Players</option>
        <option value="alliance">Alliance vs alliance</option>
      </select>
    </div>
    <div class="field" id="field-topn">
      <label for="f-topn">Top N per alliance</label>
      <select id="f-topn">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
    <div class="field" id="field-boss">
      <label for="f-boss" id="label-boss">Boss</label>
      <select id="f-boss"></select>
    </div>
    <div class="field" id="field-account">
      <label for="f-account">Player</label>
      <select id="f-account"></select>
    </div>
    <div class="field" id="field-target">
      <label for="f-target">Target</label>
      <select id="f-target"></select>
    </div>
    <div class="field" id="field-boost">
      <label for="f-boost">Boost % (what-if)</label>
      <input type="number" id="f-boost" min="0" max="500" step="5" value="20">
    </div>
    <div class="field check" id="field-top100">
      <input type="checkbox" id="f-top100">
      <label for="f-top100">Top 100 per alliance</label>
    </div>
    <div class="field" id="field-search">
      <label for="f-search" id="label-search">Search</label>
      <input type="text" id="f-search" placeholder="username...">
    </div>
  </aside>

  <main class="content">
    <div class="meta" id="meta"></div>
    <div class="info" id="info" hidden></div>
    <div class="extra" id="extra"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
